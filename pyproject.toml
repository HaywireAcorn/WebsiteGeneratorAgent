[project]
name = "websitebuilder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.5.2",
    "langchain-deepseek>=1.2.1",
    "langgraph>=1.2.24",
    "nicegui>=4.1.0",
    "pydantic>=2.14.4",
]

[project.scripts]
websitebuilder = "websitebuilder:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
